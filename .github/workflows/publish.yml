name: "Auto-Publish (OIDC)"

# Trigger on push to the 'master' branch
on:
  push:
    branches:
      - "master"

# OIDC permissions for trusted publishing + contents write for version bump
permissions:
  id-token: write  # Required for npm trusted publishing (OIDC)
  contents: write  # Required to push the version bump commit

jobs:
  auto-publish:
    name: "AutoPublish on master"
    runs-on: ubuntu-latest

    # Stops workflow from re-running after pushing the version bump commit
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version to')"

    steps:
      - name: "Checkout source code"
        uses: "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5"  # v4
        with:
          # Fetch full git history needed for version bumping
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020"  # v4
        with:
          # npm@latest (installed below for OIDC trusted publishing) requires
          # Node >= 22.22; use the current LTS.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Ensure latest npm version for provenance support
      - name: "Update npm"
        run: npm install -g npm@latest

      - name: "Install dependencies"
        run: npm ci

      # Run checks before publishing
      - name: "Lint check"
        run: npm run check

      - name: "Build package"
        run: npm run build

      - name: "Run tests"
        run: npm test

      # Configure Git for version bump commit
      - name: "Configure Git"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Bump version and commit
      - name: "Automated version bump"
        uses: "phips28/gh-action-bump-version@215e27a882516826c59df7f09da8c67d5f375cbd"  # master
        with:
          commit-message: 'chore: bump version to {{version}}'
          # The action's default word lists substring-match 'major'/'minor'
          # anywhere in the commit message, and dependabot commit footers
          # contain 'version-update:semver-major/-minor' — which escalated
          # jitsi/js-utils from 6.3.2 to 12.0.0 through routine dependency
          # updates. This repo takes weekly dependabot updates, so react
          # only to deliberate markers.
          major-wording: 'BREAKING CHANGE'
          minor-wording: 'feat:,feat('
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to npm
      - name: "Publish to npm"
        run: npm publish --provenance --access public
